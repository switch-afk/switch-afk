name: Generate growing snake

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/grow-snake.js
      - .github/workflows/snake-grow.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/grow-snake.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAKE_USER: ${{ github.repository_owner }}
          SNAKE_OUT: dist-snake

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-grow
          build_dir: dist-snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}